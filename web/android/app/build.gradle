apply plugin: 'com.android.application'

// Play refuses any upload whose versionCode it has seen before, so a hardcoded
// number means exactly one release, ever. CI passes its run number — which only
// ever increases — and local builds fall back to 1.
//
// The base offset leaves room below for the builds already handed to testers;
// versionCode must never go backwards for an installed user, or the update is
// rejected as a downgrade.
def buildNumber = (System.getenv('ORBIT_VERSION_CODE') ?: '0') as int
def orbitVersionCode = buildNumber > 0 ? 1000 + buildNumber : 1
def orbitVersionName = System.getenv('ORBIT_VERSION_NAME') ?: '1.0.0'

android {
    namespace = "com.orbit.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.orbit.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode orbitVersionCode
        versionName orbitVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // A fixed keystore (checked in) so the app's signing fingerprint stays the
    // same on every CI build. Google Sign-In is tied to this SHA-1, so it must
    // not change between builds. This is a debug/testing key, not a production
    // Play Store release key.
    signingConfigs {
        debug {
            storeFile file('../orbit.keystore')
            storePassword 'orbitdebug'
            keyAlias 'orbit'
            keyPassword 'orbitdebug'
        }
        // Play Store signing. The keystore never lives in this repo — CI writes
        // it from a secret and passes these as Gradle properties. Falls back to
        // the debug config locally so ordinary builds still work.
        release {
            if (project.hasProperty('ORBIT_STORE_FILE')) {
                storeFile file(project.property('ORBIT_STORE_FILE'))
                storePassword project.property('ORBIT_STORE_PASSWORD')
                keyAlias project.property('ORBIT_KEY_ALIAS')
                keyPassword project.property('ORBIT_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig project.hasProperty('ORBIT_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
