name: Checks

# Tests and type checks for every pull request and every push to main.
# android.yml only builds the APK (and only for web changes); this is what says
# whether a change broke the app's logic or the server's, before anyone
# installs it.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npm test

  # The desktop website. It imports the phone app's calculations from web/src,
  # so both packages are installed.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: site
      - name: Type check and build
        working-directory: site
        run: npm run build
      - name: Unit tests
        working-directory: site
        run: npm test

  server:
    runs-on: ubuntu-latest
    # A throwaway database for the server's integration tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        run: npm ci
        working-directory: server
      - name: Build
        run: npm run build
        working-directory: server
      - name: Integration tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
        working-directory: server
      # Put the failing tests and their errors on the check itself, so a red
      # check says what broke without opening the full log.
      - name: Show what failed
        if: failure()
        working-directory: server
        run: |
          summary=$(grep -E -A12 '^not ok|^    not ok' test-output.txt | grep -vE '^\s*(at |\.\.\.|---)' | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Server tests failed::${summary:-see the Integration tests step}"
