name: Build Android APK

# Builds an installable Android app from the web frontend using Capacitor.
# Run it from the GitHub "Actions" tab (Build Android APK → Run workflow),
# then download the APK from the run's "Artifacts" section and open it on
# your Android phone to install.

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Backend URL the app should talk to (e.g. https://orbit.onrender.com)'
        required: true
        type: string
      google_client_id:
        description: 'Google Web OAuth client ID for Sign-in (optional; leave blank to hide the Google button)'
        required: false
        type: string
      version_name:
        description: 'Version shown to users in the Play listing (e.g. 1.0.0). The versionCode is set from the run number automatically.'
        required: false
        default: '1.0.0'
        type: string
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    # Pinned, not `ubuntu-latest`.
    #
    # GitHub began moving that label to Ubuntu 26 on 19 October 2026, and
    # android-actions/setup-android@v3 fails on it — the build broke on a merge
    # that touched only server and web source, with no Android or workflow
    # changes at all. Nothing in this repository caused it; the machine under it
    # was replaced.
    #
    # An unpinned runner means the build can break on a day nobody committed
    # anything, which is the worst kind of failure to diagnose: the evidence
    # points at whatever was merged last. Naming the image costs a line and an
    # occasional deliberate bump, and in exchange a red build always means
    # somebody changed something.
    runs-on: ubuntu-24.04
    # Needed to create the release and its tag. The default token is read-only
    # for contents, and a release step that fails on permissions after a
    # three-minute build is a poor way to find that out.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Deliberately not android-actions/setup-android.
      #
      # That action targets Node 20. GitHub retired Node 20 on its runners and
      # now forces such actions onto Node 24, which the action does not survive
      # — it failed on every build from 19 October onwards, including one whose
      # only change was a line in a server file. Pinning the runner image did
      # not help, because the runtime is forced regardless of the OS.
      #
      # There is nothing for it to install anyway: GitHub's Ubuntu images ship
      # the Android SDK already. All that was ever needed is the path to it, so
      # that is all this does — and a step that only exports two variables
      # cannot be broken by a Node runtime change.
      - name: Locate the preinstalled Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::No preinstalled Android SDK on this runner (ANDROID_SDK_ROOT and ANDROID_HOME are unset or missing). If GitHub has stopped shipping it, install the command-line tools here instead."
            exit 1
          fi
          # cmdline-tools is normally at latest/, but take whatever is there
          # rather than assuming the layout.
          BIN="$SDK/cmdline-tools/latest/bin"
          if [ ! -d "$BIN" ]; then
            BIN=$(find "$SDK/cmdline-tools" -maxdepth 2 -type d -name bin 2>/dev/null | head -1)
          fi
          if [ -z "$BIN" ] || [ ! -x "$BIN/sdkmanager" ]; then
            echo "::error::Found an SDK at $SDK but no sdkmanager under cmdline-tools."
            ls -la "$SDK" || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$BIN" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "Android SDK: $SDK"
          echo "sdkmanager: $BIN/sdkmanager"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build web bundle
        working-directory: web
        env:
          # Manual runs supply these; pushes fall back to repo variables
          # (Settings → Secrets and variables → Actions → Variables).
          VITE_API_BASE: ${{ github.event.inputs.api_base || vars.VITE_API_BASE }}
          VITE_GOOGLE_CLIENT_ID: ${{ github.event.inputs.google_client_id || vars.VITE_GOOGLE_CLIENT_ID }}
          # Shown in Settings so a tester can tell you exactly which build they have.
          VITE_BUILD_ID: ${{ github.run_number }}
        run: |
          if [ -z "$VITE_API_BASE" ]; then
            echo "::error::VITE_API_BASE is empty. A build without a backend URL produces an APK that can never reach the server — it just says \"waking up\" forever. Run this workflow manually and fill in the backend URL, or set the repo variable VITE_API_BASE (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi
          echo "Building against backend: $VITE_API_BASE"
          npm ci
          # Tests gate the build: a broken offline queue or a date regression
          # should stop an APK being produced, not ship silently to testers.
          npm test
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: web/android
        env:
          # Play rejects a versionCode it has already seen, so it must climb on
          # every build. The run number is the only counter here that never
          # repeats or goes backwards.
          ORBIT_VERSION_CODE: ${{ github.run_number }}
          ORBIT_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-apk-${{ github.run_number }}
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---- Play Store release bundle (only when signing secrets exist) ----
      # Add these repo secrets to enable: RELEASE_KEYSTORE_BASE64,
      # RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
      # See RELEASE.md for how to create the key. Never commit the keystore.
      - name: Decode release keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > web/android/release.keystore

      - name: Build signed release bundle (AAB)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        working-directory: web/android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_ORBIT_STORE_FILE: ../release.keystore
          ORG_GRADLE_PROJECT_ORBIT_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ORBIT_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ORBIT_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ORBIT_VERSION_CODE: ${{ github.run_number }}
          ORBIT_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release bundle
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: orbit-android-release-aab
          path: web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # ---- Publish a release so the APK has a plain download link ----
      #
      # An Actions artifact can only be downloaded by someone signed in to
      # GitHub with access to the repository, which makes it useless for
      # handing the app to a friend. A release asset is a direct link.
      #
      # Done with the `gh` CLI, which is preinstalled on the runner, rather
      # than a marketplace action. That is a deliberate choice: this build was
      # broken for weeks because android-actions/setup-android@v3 stopped
      # working when GitHub retired Node 20 under it. Every third-party action
      # is a dependency that can break on a day nobody touched the repository,
      # and `gh` has no such moving parts.
      #
      # Only from main. Builds dispatched from a branch are experiments, and
      # each one minting a public release would bury the real ones.
      - name: Publish a release with the APK
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          VERSION: ${{ inputs.version_name || '1.0.0' }}
        run: |
          set -euo pipefail
          APK="orbit-$VERSION-build$GITHUB_RUN_NUMBER.apk"
          cp web/android/app/build/outputs/apk/debug/app-debug.apk "$APK"

          # The AAB only exists when the signing secrets are configured.
          FILES=("$APK")
          AAB=web/android/app/build/outputs/bundle/release/app-release.aab
          if [ -f "$AAB" ]; then
            cp "$AAB" "orbit-$VERSION-build$GITHUB_RUN_NUMBER.aab"
            FILES+=("orbit-$VERSION-build$GITHUB_RUN_NUMBER.aab")
          fi

          cat > notes.md <<NOTES
          **Build $GITHUB_RUN_NUMBER** · version $VERSION
          Commit \`${GITHUB_SHA:0:7}\`

          ### Install on Android
          Download the \`.apk\` below and open it on your phone.

          Google Play Protect will warn about this app, because it reads bank
          SMS to turn payment alerts into transactions. To install anyway:
          Play Store → your profile → **Play Protect** → gear icon → turn off
          "Scan apps with Play Protect" → install → turn it back on.

          ### Note
          This is a debug-signed build for testing, not a Play Store release.
          NOTES

          # "Re-run jobs" keeps the run number, so the tag can already exist.
          # Replace the files on that release rather than failing a build that
          # produced a perfectly good APK.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            # A pre-release: these are debug-signed test builds, and labelling
            # one "latest stable" would be untrue.
            gh release create "$TAG" "${FILES[@]}" \
              --title "Orbit $VERSION (build $GITHUB_RUN_NUMBER)" \
              --notes-file notes.md \
              --prerelease
          fi

          echo "Released: $(gh release view "$TAG" --json url --jq .url)"
