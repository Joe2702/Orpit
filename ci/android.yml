name: Build Android APK

# Builds an installable Android app from the web frontend using Capacitor.
# Run it from the GitHub "Actions" tab (Build Android APK → Run workflow),
# then download the APK from the run's "Artifacts" section and open it on
# your Android phone to install.

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Backend URL the app should talk to (e.g. https://orbit.onrender.com)'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build web bundle
        working-directory: web
        env:
          # Manual runs supply the URL; pushes fall back to the repo variable
          # VITE_API_BASE (Settings → Secrets and variables → Actions → Variables).
          VITE_API_BASE: ${{ github.event.inputs.api_base || vars.VITE_API_BASE }}
        run: |
          if [ -z "$VITE_API_BASE" ]; then
            echo "::warning::VITE_API_BASE is empty — the built app won't reach a backend. Set the repo variable VITE_API_BASE or run the workflow manually with the URL."
          fi
          npm ci
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: web/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-android-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
